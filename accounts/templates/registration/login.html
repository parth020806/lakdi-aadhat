{% extends "base.html" %}
{% block content %}
<h1 class="text-2xl font-semibold mb-4">Login</h1>
<form method="post" class="bg-white p-5 rounded shadow max-w-md space-y-3">
  {% csrf_token %}{{ form.as_p }}
  <button class="bg-amber-800 text-white px-5 py-2 rounded">Login</button>
  <p class="text-sm">New factory? <a class="underline" href="{% url 'signup' %}">Register here</a></p>
</form>
{% endblock %}
