<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ BUSINESS.name }}{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-50 text-stone-800">
<nav class="bg-amber-900 text-amber-50">
  <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center gap-4">
    <a href="{% url 'home' %}" class="font-bold text-lg">{{ BUSINESS.name }}</a>
    <div class="flex-1"></div>
    <a href="{% url 'home' %}" class="hover:underline">Home</a>
    <a href="{% url 'contact' %}" class="hover:underline">Contact</a>
    {% if user.is_authenticated %}
      <a href="{% url 'dashboard' %}" class="hover:underline">Portal</a>
      <form method="post" action="{% url 'logout' %}" class="inline">{% csrf_token %}
        <button class="bg-amber-700 px-3 py-1 rounded">Logout</button></form>
    {% else %}
      <a href="{% url 'login' %}" class="hover:underline">Login</a>
      <a href="{% url 'signup' %}" class="bg-amber-600 px-3 py-1 rounded">Register</a>
    {% endif %}
  </div>
</nav>
<main class="max-w-6xl mx-auto px-4 py-6">
  {% for m in messages %}
    <div class="mb-3 p-3 rounded {% if m.tags == 'error' %}bg-red-100 text-red-800{% else %}bg-green-100 text-green-800{% endif %}">{{ m }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
<footer class="text-center text-sm text-stone-500 py-6">
  {{ BUSINESS.address }} <br> {{ BUSINESS.phone }} <br> GSTIN: {{ BUSINESS.gstin }}
</footer>
<a href="https://wa.me/{{ BUSINESS.whatsapp }}" class="fixed bottom-4 right-4 bg-green-600 text-white px-4 py-3 rounded-full shadow-lg">WhatsApp</a>
</body>
</html>
